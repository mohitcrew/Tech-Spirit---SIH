<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/djmqwehwk/image/upload/v1789448241/Gemini_Generated_Image_998udj998udj2998u_fdbwjy.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/djmqwehwk/image/upload/v1789448241/Gemini_Generated_Image_998udj998udj2998u_fdbwjy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSync — From Learning Management to Capacity Intelligence</title>
    <meta name="description" content="SkillSync connects roles, skills, competencies, learning opportunities, trainers, assessments, and outcomes to create a smarter capacity-building experience." />
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Immediate Theme Initialization (prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skillsync-theme') || localStorage.getItem('skillsync_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
